<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
  <meta charset="utf-8">

<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@6/dist/echarts.min.js"></script>
  
  <!-- Uncomment this line if you want to dataTool extension
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/extension/dataTool.min.js"></script>

  <!-- Uncomment this line if you want to use gl extension
  <script type="text/javascript" src="https://echarts.apache.org/zh/js/vendors/echarts-gl/dist/echarts-gl.min.js"></script>

  <!-- Uncomment this line if you want to echarts-stat extension
  <script type="text/javascript" src="https://echarts.apache.org/zh/js/vendors/echarts-stat/dist/ecStat.min.js"></script>
  -->
  <!-- Uncomment this line if you want to echarts-graph-modularity extension
  <script type="text/javascript" src="https://echarts.apache.org/zh/js/vendors/echarts-graph-modularity/dist/echarts-graph-modularity.min.js"></script>

  <!-- Uncomment this line if you want to use map

  -->
  <!-- Uncomment these two lines if you want to use bmap extension
  <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=YOUR_API_KEY"></script>
  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/extension/bmap.min.js"></script>
  -->

  <script type="text/javascript">
    // 获取 URL 中的主题参数
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'light';
    const isDark = theme === 'dark';
    var dom = document.getElementById('container');
    // 初始化图表时传入主题
    // ECharts 内置了 'dark' 主题，开启后会自动处理大部分背景和文字颜色
    var myChart = echarts.init(dom, isDark ? 'dark' : null, {
        renderer: 'canvas', // 建议改为 canvas，点多了 SVG 会卡
        useDirtyRect: false
    });
    var app = {};
    
    var option;

    const celltypes = [
  'CN',
  'EM',
  'GA',
  'GL',
  'HA',
  'NE',
  'SG'
];

const celltypeColors = {
  'CN': '#17becf',  // CN 青色 '#17becf'
  'EM': '#9467bd',  // EM 紫色 '#9467bd'
  'GA': '#ff7f0e',  // GA 橙色 '#ff7f0e'
  'GL': '#d62728',  // GL 红色 '#d62728'
  'HA': '#8c564b',  // HA 棕色 '#8c564b'
  'NE': '#2ca02c',  // NE 绿色 '#2ca02c'
  'SG': '#fedb61'   // SG 黄色 '#fedb61'
};

// CCC matrix
// CCC matrix (with -related suffix)
const matrix = {
  'CN': {
    'CN': 8.98,
    'HA': 8.59,
    'SG': 8.64,
    'GL': 8.39,
    'GA': 9.13,
    'EM': 9.42,
    'NE': 8.93
  },
  'HA': {
    'CN': 8.38,
    'HA': 7.90,
    'SG': 8.17,
    'GL': 7.92,
    'GA': 8.64,
    'EM': 8.92,
    'NE': 8.34
  },
  'SG': {
    'CN': 8.73,
    'HA': 7.95,
    'SG': 8.26,
    'GL': 7.95,
    'GA': 8.70,
    'EM': 8.97,
    'NE': 8.39
  },
  'GL': {
    'CN': 8.33,
    'HA': 7.73,
    'SG': 8.08,
    'GL': 7.72,
    'GA': 8.51,
    'EM': 8.78,
    'NE': 8.19
  },
  'GA': {
    'CN': 9.15,
    'HA': 8.44,
    'SG': 8.76,
    'GL': 8.45,
    'GA': 9.21,
    'EM': 9.48,
    'NE': 8.89
  },
  'EM': {
    'CN': 9.41,
    'HA': 8.72,
    'SG': 9.05,
    'GL': 8.73,
    'GA': 9.49,
    'EM': 9.76,
    'NE': 9.18
  },
  'NE': {
    'CN': 8.84,
    'HA': 8.22,
    'SG': 8.53,
    'GL': 8.24,
    'GA': 8.98,
    'EM': 9.26,
    'NE': 8.67
  }
};

// mean center (relative strength)
let values = [];
celltypes.forEach(s =>
  celltypes.forEach(t => values.push(matrix[s][t]))
);
const meanVal = values.reduce((a, b) => a + b, 0) / values.length;

// build links
const links = [];
celltypes.forEach(source => {
  celltypes.forEach(target => {
    const delta = matrix[source][target] - meanVal;
    if (Math.abs(delta) > 0) {
      links.push({
        source: source,
        target: target,
        value: Math.abs(delta)
      });
    }
  });
});

option = {
  title: {
    // 使用 rich 样式标记：{i|...} 对应下面 rich 中的 i 配置
    text: 'Cell type communication strength', 
    subtext: '(Auco_SC by MDIC3)',
    left: 'center',
    // top: '1%',
    textStyle: { 
      fontSize: 14,
      fontWeight: 'normal'
    },
    subtextStyle: {
      fontSize: 12
    }
  },
  tooltip: {
    show: true,
    trigger: 'item',
    backgroundColor: 'rgba(255, 255, 255, 0.9)',
    borderColor: '#ccc',
    borderWidth: 1,
    textStyle: { color: '#333' },
    formatter: function (params) {
      // 如果鼠标悬浮在连线（Edge）上
      if (params.dataType === 'edge') {
        const source = params.data.source;
        const target = params.data.target;
        // 使用 .toFixed(2) 保留两位小数
        const val = params.data.value.toFixed(2);
        return `
          <div style="text-align:left;">
            ${source} <br/> ↓ ↑ <br/> ${target}<br/>
            Strength: <b>${val}</b>
          </div>
        `;
      } 
      // 如果鼠标悬浮在节点（Node/CellType）上
      return `<b>Cell Group:</b> ${params.name}`;
    }
  },
  toolbox: {
    // left: '75%',
    feature: {
      saveAsImage: { title: 'Download' }
    }
  },
  series: [
    {
      type: 'chord',
      padAngle: 1,
      center: ['50%', '50%'],
      radius: ['55%', '65%'],

      data: celltypes.map(ct => ({
        name: ct,
        itemStyle: {
          color: celltypeColors[ct],
          borderColor: '#ffffff',
          borderWidth: 2,
          borderRadius: [0, 15]
        }
      })),

      lineStyle: {
        opacity: 0.35,
        color: 'gradient'   // ⭐ 非常推荐
      },

      emphasis: {
        focus: 'self'
      },

      label: {
        show: true,
        position: 'inside',
        fontSize: 10,
        color: '#ffffff',
        fontWeight: 'bold',
        textBorderColor: 'rgba(0, 0, 0, 0.8)', 
        textBorderWidth: 1,
        textShadowColor: 'rgba(0, 0, 0, 0.5)',
        textShadowBlur: 5,
        formatter: '{b}'
      },

      links: links
    }
  ]
};

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
